spring.application.name=Bookshop
spring.datasource.url=jdbc:postgresql://localhost:5432/bookhouse?options=-c%20TimeZone%3DAsia/Ho_Chi_Minh
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=BookshopJwtSecretKeyMustBeAtLeastThirtyTwoCharactersLong2026
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000
